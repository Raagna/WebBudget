name: Deploy frontend to GitHub Pages

# Builds frontend/ and publishes it to GitHub Pages on every push to main.
# The backend (Express + Postgres) is NOT deployed by this workflow -
# GitHub Pages only serves static files. Deploy the backend separately
# (e.g. Render) and point VITE_API_URL at it - see the README's
# "Deployment" section.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          # /<repo-name>/ so asset URLs match where Pages actually serves
          # this from. Override in repo Settings > Pages if you're using a
          # custom domain (in which case this should just be "/").
          BASE_PATH: /${{ github.event.repository.name }}/
          # Set this in Settings > Secrets and variables > Actions >
          # Variables as VITE_API_URL, pointing at your deployed backend,
          # e.g. https://your-backend.onrender.com/api
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
